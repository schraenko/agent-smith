[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-smith-crewai"
version = "0.1.0"
description = "Modular agentic workflows — CrewAI edition"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.11.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "ddgs>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.setuptools.packages.find]
include = ["agent_smith_crewai*"]
